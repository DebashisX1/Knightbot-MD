services:
  - type: web
    name: knightbot-md
    env: node
    plan: free
    buildCommand: "npm install --legacy-peer-deps"
    startCommand: "npm start"
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NPM_CONFIG_PRODUCTION
        value: false
